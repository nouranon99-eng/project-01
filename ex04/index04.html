<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
</head>
<body>

    <form>

        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" required minlength="2">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="8">

        <label for="student">Student</label>
        <input type="radio" id="student" name="status" value="student" required>

        <label for="professional">Professional</label>
        <input type="radio" id="professional" name="status" value="professional">

        <label for="agreement">I agree to the terms</label>
        <input type="checkbox" id="agreement" name="agreement" required>

        <label for="country">Country</label>
        <select id="country" name="country" required>
            <option value="">Select a country</option>
            <option value="jordan">Jordan</option>
            <option value="palestine">Palestine</option>
            <option value="saudi-arabia">Saudi Arabia</option>
            <option value="uae">United Arab Emirates</option>
        </select>

        <label for="message">About You</label>
        <textarea id="message" name="message" minlength="10"></textarea>

        <button type="submit">Register</button>

    </form>

</body>
</html>
